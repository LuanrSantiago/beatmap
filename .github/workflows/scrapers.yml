name: Scrapers diários
on:
      # 9h e 9h15 no horário de Brasília (UTC-3, sem horário de verão desde 2019)
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraper.run_once